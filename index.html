<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil do jogador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <nav class="nav-links">
      <a href="#">Início</a>
      <a href="#">Catálogo</a>
      <a href="#">Sobre nós</a>
    </nav>

    <label class="search-box">
      <input type="search" aria-label="Pesquisar">
      <i class="fa-solid fa-magnifying-glass"></i>
    </label>

    <div class="nav-actions">
      <a class="profile-shortcut" href="#" aria-label="Perfil"><i class="fa-solid fa-user"></i></a>
      <a class="brand-mark" href="#" aria-label="Página inicial"><i class="fa-solid fa-dragon"></i></a>
    </div>
  </header>

  <main class="page">
    <section class="profile-card">
      <div class="cover">
        <span class="age-rating"></span>
      </div>

      <div class="profile-content">
        <section class="user-summary">
          <div class="avatar avatar-large"><i class="fa-solid fa-user"></i></div>
          <div class="user-info">
            <h1>Carrasqueira</h1>
            <p class="email">matheuscarrasqueiraneto@gmail.com</p>
            <p class="bio-short">Menor quente</p>
          </div>
        </section>

        <section class="stats" aria-label="Estatísticas do jogador">
          <div class="stat">
            <i class="fa-solid fa-gamepad"></i>
            <div><span>Jogos</span><strong>120</strong></div>
          </div>
          <div class="stat">
            <i class="fa-solid fa-trophy"></i>
            <div><span>Conquistas</span><strong>26</strong></div>
          </div>
          <div class="stat">
            <i class="fa-solid fa-user-group"></i>
            <div><span>Amigos</span><strong>22</strong></div>
          </div>
          <div class="stat">
            <i class="fa-regular fa-clock"></i>
            <div><span>Horas jogadas</span><strong>380</strong></div>
          </div>
        </section>

        <section class="favorites">
          <h2>Jogos favoritos <i class="fa-solid fa-star"></i></h2>
          <div class="game-list">
            <img src="imagens/god of ware.png" alt="God of War">
            <img src="imagens/cyberpunk.png" alt="Cyberpunk 2077">
            <img src="imagens/spider man.png" alt="Marvel's Spider-Man Remastered">
            <img src="imagens/fortnite.png" alt="Fortnite" onerror="this.src='https://images.unsplash.com/photo-1542751371-adc38448a05e?w=400&h=600&fit=crop'">
            <img src="imagens/metro.png " alt="Metro Exodus">
            <img src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/287390/library_600x900.jpg" alt="Metro Last Light">
          </div>
        </section>

        <section class="edit-profile">
          <h2>Editar perfil</h2>
          <p class="helper">Clique na foto ou no banner para trocar a imagem. Atualize também as informações da sua conta.</p>

          <form action="#" method="post">
            <div class="form-field">
              <label for="description">Descrição</label>
              <textarea id="description" name="description" placeholder="Menor quente"></textarea>
            </div>

            <div class="form-field">
              <label for="name">Nome</label>
              <input id="name" name="name" type="text" value="Carrasqueira">
            </div>

            <div class="form-field">
              <label for="email">E-mail</label>
              <input id="email" name="email" type="email" value="matheuscarrasqueiraneto@gmail.com">
            </div>

            <div class="form-field">
              <label for="password">Nova senha</label>
              <input id="password" name="password" type="password" placeholder="Opcional">
            </div>

            <div class="form-actions">
              <button class="cancel" type="reset">Cancelar</button>
              <button class="save" type="submit">Salvar alterações</button>
            </div>
          </form>
        </section>
      </div>
    </section>
  </main>

  <footer class="footer-line"></footer>
</body>
</html>
